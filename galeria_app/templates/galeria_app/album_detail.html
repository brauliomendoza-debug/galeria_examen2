<!DOCTYPE html>
<html>
<head>
    <title>{{ object.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

   
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>{{ object.nombre }}</h1>
        </div>

        <a href="{% url 'foto_create_album' object.id %}" class="btn btn-primary">
            Agregar Foto
        </a>
    </div>

    <a href="{% url 'album_list' %}" class="btn btn-secondary mb-3">
        Volver
    </a>

    <div class="row">

        {% for foto in object.foto_set.all %}
        <div class="col-md-3 mb-4">

            <div class="card shadow-sm h-100">

                <img src="{{ foto.archivo.url }}" class="card-img-top" style="height:200px; object-fit:cover;">

                <div class="card-body text-center">
                    <strong>{{ foto.titulo }}</strong>
                </div>

                <div class="card-footer d-flex justify-content-between">

                    <a href="{% url 'foto_update' foto.id %}" class="btn btn-sm btn-warning">
                        Editar
                    </a>

                    <a href="{% url 'foto_delete' foto.id %}" class="btn btn-sm btn-danger">
                        Eliminar
                    </a>

                </div>

            </div>

        </div>

        {% empty %}
            <p>No hay fotos en este álbum</p>
        {% endfor %}

    </div>

</div>

</body>
</html>
