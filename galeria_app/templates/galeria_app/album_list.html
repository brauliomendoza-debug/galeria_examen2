<!DOCTYPE html>
<html>
<head>
    <title>Álbumes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Álbumes</h1>
        <a href="{% url 'album_create' %}" class="btn btn-primary">
             Nuevo Álbum
        </a>
    </div>

    <div class="row">

        {% for a in object_list %}
        <div class="col-md-4 mb-4">

            <div class="card h-100 shadow-sm">

                {% if a.portada %}
                    <img src="{{ a.portada.url }}" class="card-img-top" style="height:200px; object-fit:cover;">
                {% else %}
                    <div class="bg-secondary text-white d-flex align-items-center justify-content-center" style="height:200px;">
                        Sin imagen
                    </div>
                {% endif %}

                <div class="card-body">
                    <h5 class="card-title">{{ a.nombre }}</h5>
                    <p class="card-text">{{ a.descripcion }}</p>
                </div>

                <div class="card-footer d-flex justify-content-between">

                    <a href="{% url 'album_detail' a.id %}" class="btn btn-sm btn-info">
                         Ver
                    </a>

                    <a href="{% url 'album_update' a.id %}" class="btn btn-sm btn-warning">
                         Editar
                    </a>

                    <a href="{% url 'album_delete' a.id %}" class="btn btn-sm btn-danger">
                         Eliminar
                    </a>

                </div>

            </div>

        </div>
        {% empty %}
            <p>No hay álbumes registrados</p>
        {% endfor %}

    </div>

</div>

</body>
</html>
