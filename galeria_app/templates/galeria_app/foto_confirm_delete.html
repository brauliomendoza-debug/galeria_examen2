<!DOCTYPE html>
<html>
<head>
    <title>Eliminar Foto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow text-center">

                <div class="card-header bg-danger text-white">
                    <h4> Eliminar Foto</h4>
                </div>

                <div class="card-body">
                    
                    <p>¿Estás seguro que deseas eliminar esta foto?</p>

                    {% if object.archivo %}
                        <img src="{{ object.archivo.url }}" class="img-fluid mb-3" style="max-height:200px;">
                    {% endif %}

                    <p><strong>{{ object.titulo }}</strong></p>

                    <form method="post">
                        {% csrf_token %}

                        <div class="d-flex justify-content-center gap-2 mt-3">
                            
                            <button type="submit" class="btn btn-danger">
                                 Sí, eliminar
                            </button>

                            <a href="{% url 'album_detail' object.album.id %}" class="btn btn-secondary">
                                 Cancelar
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
